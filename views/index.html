<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-100">

<head>
  <meta charset="UTF-8">
  <title>FlyAI</title>

  <link href="assets/css/daisyui-4.4.14-full.min.css" rel="stylesheet" type="text/css"/>
  <link href="assets/css/index.css" rel="stylesheet" type="text/css"/>

  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio,line-clamp"></script>
  <script src="assets/js/index.js"></script>
</head>

<body class="h-full">
<div class="min-h-full">
  {{ template "head.html" "index"}}

  <main class="-mt-32">
    <div class="mx-auto max-w-7xl px-4 pb-12 sm:px-6 lg:px-8">
      <div class="rounded-lg bg-white px-5 py-6 shadow sm:px-6 text-2xl">
        <dl class="mt-5 grid grid-cols-1 gap-5 sm:grid-cols-3">
          <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow sm:p-6">
            <dt class="truncate text-sm font-medium text-gray-500">已开启监控</dt>
            <dd class="mt-1 text-3xl font-semibold tracking-tight text-gray-900">{{ .monitorCount }}</dd>
            <dd class="mt-1 text-xs font-semibold tracking-tight text-gray-500">仅记录所选群的新消息</dd>
          </div>
          <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow sm:p-6">
            <dt class="truncate text-sm font-medium text-gray-500">群组数量</dt>
            <dd class="mt-1 text-3xl font-semibold tracking-tight text-gray-900">{{ .groupCount }}</dd>
            <dd class="mt-1 text-xs font-semibold tracking-tight text-gray-500">当前通讯录中的群聊</dd>
          </div>
          <div class="overflow-hidden rounded-lg bg-white px-4 py-5 shadow sm:p-6">
            <dt class="truncate text-sm font-medium text-gray-500">已开启每周排行榜</dt>
            <dd class="mt-1 text-3xl font-semibold tracking-tight text-gray-900">{{ .rankCount }}</dd>
            <dd class="mt-1 text-xs font-semibold tracking-tight text-gray-500">{{.weeklyScheduleLabel}} {{.weeklyTime}} 自动发送</dd>
          </div>
        </dl>
      </div>
    </div>
  </main>

  {{ template "footer.html" }}
</div>

</body>
